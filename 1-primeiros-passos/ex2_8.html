<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 2.8. Leia 4 números, aceitando apenas valores maiores que 0 e menores que 10. Calcule a média e:
       // - se média > 5, exiba "Você passou no teste";
       // - caso contrário, exiba "Tente novamente".

       var nota1 = Number(prompt("Insira a primeira nota: "));
       var nota2 = Number(prompt("Insira a segunda nota: "));
       var nota3 = Number(prompt("Insira a terceira nota: "));
       var nota4 = Number(prompt("Insira a quarta nota: "));

        if (nota1 >= 0 && nota1 <= 10 &&
            nota2 >= 0 && nota2 <= 10 &&
            nota3 >= 0 && nota3 <= 10 &&
            nota4 >= 0 && nota4 <= 10) {

            var media=(nota1+nota2+nota3+nota4)/4;

            if (media>5){
                alert("Você passou no teste");
            }
            else {
                alert("Tente novamente");
            }
        } else {
            alert("As notas devem ser maiores que 0 e menores que 10.");
        }
    </script>
</head>
