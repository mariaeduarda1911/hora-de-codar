    <title>Document</title>
    <script>
        // 2.4. Leia 3 valores diferentes e mostre a soma dos 2 maiores.
        var valor1=Number(prompt("Insira o primeiro valor: "));
        var valor2=Number(prompt("Insira o segundo valor: "));
        var valor3=Number(prompt("Insira o terceiro valor: "));
        var soma;

        // 1 e 2
        if (valor1>valor3 && valor2>valor3){
            soma=valor1+valor2;
            alert("A soma do primeiro e segundo número é de "+soma)
        // 1 e 3
        }
        else if(valor1>valor2 && valor3>valor2){
            soma=valor1+valor3
            alert("A soma do primeiro e terceiro número é de "+soma)
        // 2 e 3
        }
        else if(valor2>valor1 && valor3>valor1){
            soma=valor2+valor3
            alert("A soma do segundo e terceiro número é de "+soma)
        }

    </script>
