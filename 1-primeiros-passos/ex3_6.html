<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 3.6. Leia 6 notas válidas (de 0 a 10), calcule e exiba a média simples.
        var nota1 = parseFloat(prompt("Insira a primeira nota "));
        var nota2 = parseFloat(prompt("Insira a segunda nota "));
        var nota3 = parseFloat(prompt("Insira a terceira nota "));
        var nota4 = parseFloat(prompt("Insira a quarta nota "));
        var nota5 = parseFloat(prompt("Insira a quinta nota "));
        var nota6 = parseFloat(prompt("Insira a sexta nota "));

        media=(nota1+nota2+nota3+nota4+nota5+nota6)/6

        document.write("A média simples das notas indicadas é: "+media.toFixed(2))
    </script>
</head>

</body>
</html>
