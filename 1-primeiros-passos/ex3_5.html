<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 3.5. Leia 2 notas de um aluno, calcule a média final e considere aprovação com nota 9,5. Em seguida, 
        // pergunte: `Calcular a média de outro aluno? (S/N)`. Se a resposta for `S`, repita; caso contrário, 
        // encerre e mostre a quantidade de alunos aprovados.

        var aprovados = 0;
        var resposta = "S";

        while (resposta == "S" || resposta == "s") {

            var nota1 = parseFloat(prompt("Digite a primeira nota:"));
            var nota2 = parseFloat(prompt("Digite a segunda nota:"));

            var media = (nota1 + nota2) / 2;

            alert("A média do aluno é: " + media);

            if (media >= 9.5) {
                alert("APROVADO!");
                aprovados = aprovados + 1; 
            } else {
                alert("REPROVADO!");
            }

            resposta = prompt("Calcular a média de outro aluno? (S/N)");
        }

        document.write("Quantidade de alunos aprovados: " + aprovados);
        </script>
</head>

</body>
</html>
