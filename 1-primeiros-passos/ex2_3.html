    <title>Document</title>
        <script>
        // 2.3. Leia 3 valores diferentes e mostre o maior.

        var numero1 = Number(prompt("Insira o primeiro número: "));
        var numero2 = Number(prompt("Insira o segundo número: "));
        var numero3 = Number(prompt("Insira o terceiro número: "));

        if (numero1 > numero2 && numero1 > numero3){
            alert ("O número "+numero1+" é maior que "+numero2+" e "+numero3)
        } 
        else if (numero2>numero1 && numero2>numero3){
            alert ("O número "+numero2+" é maior que "+numero1+" e "+numero3)
        }
        else if (numero1 == numero2 && numero1 == numero3 && numero2 == numero3){
            alert("Os três números são iguais")
        }
        else{
            alert ("O número "+numero3+" é maior que "+numero1+" e "+numero2)
        }
        </script>
