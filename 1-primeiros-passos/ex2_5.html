<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 2.5. Leia 6 valores, exiba todos e calcule a média aritmética.
        var valor1=Number(prompt("Insira o primeiro valor: "));
        var valor2=Number(prompt("Insira o segundo valor: "));
        var valor3=Number(prompt("Insira o terceiro valor: "));
        var valor4=Number(prompt("Insira o quarto valor: "));
        var valor5=Number(prompt("Insira o quinto valor: "));
        var valor6=Number(prompt("Insira o sexto valor: "));

        var soma=valor1+valor2+valor3+valor4+valor5+valor6;
        var media=soma/6;

        // toFixed(2): 2 casas decimais
        alert("A média dos valores indicados é "+media.toFixed(2))
    </script>
</head>
<body>
    
</body>
</html>
