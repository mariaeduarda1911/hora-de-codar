<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 2.1. Leia dois números e mostre o maior deles.

        var numero1 = Number(prompt("Insira um número: "));
        var numero2 = Number(prompt("Insira outro número: "));

        // Processamento
        if (numero1 > numero2){
            alert ("O número "+numero1+" é maior que "+numero2)
        } 
        else if (numero2>numero1){
            alert ("O número "+numero2+" é maior que "+numero1)
        }
        else{
            alert ("Ambos os números são iguais")
        }

    </script>
