<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 3.4. Leia dois inteiros (sendo o primeiro menor que o segundo) e calcule a média desses números e de todos os inteiros entre eles.
        var inicio = parseInt(prompt("Insira o primeiro número (menor):"));
        var fim = parseInt(prompt("Insira o segundo número (maior):"));

        // Média dos valores informados
        var mediaInformados = (inicio + fim) / 2;

        var soma = 0;
        var qtd = 0;

        // Média dos valores do intervalo
        for (var i = inicio; i <= fim; i++) {
            soma += i;
            qtd++;
        }

        var mediaIntervalo = soma / qtd;

        document.write("A média aritmética de " + inicio + " e " + fim + " é: " + mediaInformados + "<br>");
        document.write("A média de todos os inteiros entre eles é: " + mediaIntervalo);
    </script>
</head>
<body>
    
</body>
</html>
