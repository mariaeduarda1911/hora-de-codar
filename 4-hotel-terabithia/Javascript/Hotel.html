<html>

	<head>
		<script>
			// 1. Defina o nome do hotel e use-o no lugar de `{Hotel}` em todas as mensagens.
			var nomeHotel = "Terabithia";

			// Quantidade inicial de quartos livres 
			var qtdQuartos = 20;

			// Quartos já reservados
			var quartosOcupados = [];

			// Reservas realizadas
			var reservas = [];

			// Lista de hóspedes
			var lista_hospedes = [];

			// Eventos confirmados
			var eventosConfirmados = [];

			// 2. Ao abrir o sistema, exiba: `Bem-vindo ao {Hotel}`
			alert(`Bem-vindo(a) ao Hotel ${nomeHotel}`);

			// 3. Solicite nome do usuário e senha.
			var nomeUsuario = prompt("Informe seu usuário: ");
			var senha;
			var senhaCorreta="2678";

			// Contador de tentativas de acesso
			var tentativas = 0;

			// 4. Senha obrigatória: `2678`.
			// 5. Permita no máximo **3 tentativas de senha**.
			//- Ao exceder: encerrar sistema com mensagem de bloqueio.

			while(tentativas<3){
				senha=prompt("Informe sua senha");

				if(senha===senhaCorreta){
					alert(`Bem-vindo ao Hotel ${nomeHotel}, ${nomeUsuario}. É um imenso prazer ter você por aqui!`);
					break;
				} else {
					tentativas++;
					alert("Senha incorreta!");
				}
			}

			if (tentativas === 3 && senha !== senhaCorreta) {
				alert("Sistema bloqueado. Número máximo de tentativas excedido.");
			} else {
				inicio();
			}



			function inicio() {
				var escolha = parseInt(prompt('Selecione uma opção\n1.) Reserva de Quartos\n2.) Cadastro de Hóspedes\n3.) Eventos\n4.) Ar-Condicionado\n5.) Abastecimento de Carros\n6.) Relatórios Operacionais\n7.) Sair'));

				if (escolha === 1) {
					reserva_quartos();
				} else if (escolha === 2) {
					cadastro_hospedes();
				} else if (escolha === 3) {
					eventos();
				} else if (escolha === 4) {
					ar_condicionado();
				} else if (escolha === 5) {
					abastecer_carros();
				} else if (escolha === 6) {
					relatorios_operacionais();
				} else if (escolha === 7) {
					sair();
				} else {
					erro();
				}
			}		



			function reserva_quartos() {
				alert(`HOTEL ${nomeHotel} - RESERVA DE QUARTOS`);

				// Nome do hóspede
				var nomeHospede = prompt("Informe o nome do hóspede: ");

				// Valor diária
				var valDiaria = parseFloat(prompt("Informe o valor da diária: "));
				if (valDiaria <= 0 || isNaN(valDiaria)) {
					alert(`Valor inválido, ${nomeHospede}`);
					inicio();
					return;
				}

				// Quantidade de dias
				var qtdDias = parseInt(prompt("Informe a quantidade de dias para hospedagem"));
				if (qtdDias < 1 || qtdDias > 30 || isNaN(qtdDias)) {
					alert(`Valor inválido, ${nomeHospede}`);
					inicio();
					return;
				}

				// Tipo de quarto
				var tipoQuarto = prompt("Informe o tipo de quarto (S/E/L)");

				while (tipoQuarto != "S" && tipoQuarto != "E" && tipoQuarto != "L") {
					tipoQuarto = prompt("Informe o tipo de quarto (S/E/L)");
				}

				if (tipoQuarto == "S") {
					var subtotal = qtdDias * valDiaria * 1.00;
				} else if (tipoQuarto == "E") {
					var subtotal = qtdDias * valDiaria * 1.35;
				} else if (tipoQuarto == "L") {
					var subtotal = qtdDias * valDiaria * 1.65;
				}

				var taxaServico = subtotal * 0.10;
				var totalFinal = subtotal + taxaServico;

				if (qtdQuartos===0){
					alert("Não há quartos disponíveis.");
					inicio();
					return;
				}

				// Mapa de quartos
				var mapaQuartos = "";

				for (var i = 1; i <=20; i++){
					if (quartosOcupados.includes(i)){
						mapaQuartos += i + " O";
					} else {
						mapaQuartos += i + " L";
					}

					if (i%5===0){
						mapaQuartos += "\n";
					} else {
						mapaQuartos += "   ";
					}
				}

				alert(mapaQuartos);

				// Número do quarto
				var numeroQuarto = parseInt(prompt("Informe o número do quarto (1 a 20): "));

				while (numeroQuarto < 1 || numeroQuarto > 20 || isNaN(numeroQuarto)) {
					alert("Quarto inválido");
					numeroQuarto = parseInt(prompt("Informe o número do quarto (1 a 20): "));
				}

				// Verifica se o quarto já está ocupado
				while (quartosOcupados.includes(numeroQuarto)) {
					alert("Quarto já está ocupado");

					// Lista quartos livres
					var quartosLivres = "";

					for (var i = 1; i <= 20; i++) {
						if (!quartosOcupados.includes(i)) {
							quartosLivres += i + " ";
						}
					}

					alert(`Quartos livres: ${quartosLivres}`);

					numeroQuarto = parseInt(prompt("Escolha outro quarto (1 a 20): "));

					while (numeroQuarto < 1 || numeroQuarto > 20 || isNaN(numeroQuarto)) {
						alert("Quarto inválido");
						numeroQuarto = parseInt(prompt("Escolha outro quarto (1 a 20): "));
					}
				}

				// Confirmação da reserva
				var confirma = confirm(`Confirma a reserva do quarto ${numeroQuarto} para ${nomeHospede}?`);

				if (confirma) {
					quartosOcupados.push(numeroQuarto);
					qtdQuartos--;

					// Registra a reserva em memória
					reservas.push({
						hospede: nomeHospede,
						quarto: numeroQuarto,
						diarias: qtdDias,
						total: totalFinal
					});

					alert(`Reserva realizada com sucesso!
					Hóspede: ${nomeHospede}
					Quarto: ${numeroQuarto}
					Subtotal: R$ ${subtotal.toFixed(2)}
					Taxa de serviço: R$ ${taxaServico.toFixed(2)}
					Total: R$ ${totalFinal.toFixed(2)}`);

					inicio();
				} else {
					inicio();
				}
			}



			function cadastro_hospedes() {
				alert(`HOTEL ${nomeHotel} - CADASTRO DE HÓSPEDES`);
				sistema_cadastrar_hospedes();
			}



			function sistema_cadastrar_hospedes() {

				var escolha_hospedes = parseInt(prompt('Cadastro de Hóspedes\n\n Selecione uma opção: \n1. Cadastrar \n2. Pesquisar por nome exato \n3. Pesquisar por prefixo \n4. Listar hóspedes \n5. Atualizar hóspede \n6. Remover hóspede \n7. Voltar'));

				if (escolha_hospedes === 1) {
					cadastrar_hospedes();
				} else if (escolha_hospedes === 2) {
					pesquisar_hospedes();
				} else if (escolha_hospedes === 3) {
					pesquisar_prefixo_hospedes();
				} else if (escolha_hospedes === 4) {
					listar_hospedes();
				} else if (escolha_hospedes === 5) {
					atualizar_hospede();
				} else if (escolha_hospedes === 6) {
					remover_hospede();
				} else if (escolha_hospedes === 7) {
					inicio();
				} else {
					erro_pesquisar_hospedes();
				}
			}



			function cadastrar_hospedes() {
				if (lista_hospedes.length >= 15){
					alert("Numero máximo de hóspedes cadastrados.");
				} else {	
					var nome_hospede = prompt('Por favor, informe o nome da(o) hóspede:');

					var nomeExiste = false;

					for (var i = 0; i < lista_hospedes.length; i++) {
						if (lista_hospedes[i].nome === nome_hospede) {
							nomeExiste = true;
							break;
						}
					}

					if (nomeExiste){
						alert("Hóspede já cadastrado.");
					} else {
						var dataCadastro = new Date();

						// Salva na lista
						lista_hospedes.push({
							nome: nome_hospede,
							data: dataCadastro
						});

						console.log(lista_hospedes);
						alert("Sucesso! Hóspede " + nome_hospede + " foi cadastrada(o) com sucesso!\n");
					}
				}

				sistema_cadastrar_hospedes();
			}



			// Pesquisa por nome
			function pesquisar_hospedes() {
				var nome_hospede = prompt('Por favor, informe o nome da(o) hóspede para pesquisa:');
				var encontrado = false;

				for (var i = 0; i < lista_hospedes.length; i++) {
					if (lista_hospedes[i].nome === nome_hospede) {
						encontrado = true;
						break;
					}
				}

				if (encontrado) {
					alert(nome_hospede + ' encontrada(o).');
				} else {
					alert(nome_hospede + ' não foi encontrada(o).');
				}

				sistema_cadastrar_hospedes();
			}



			// Pesquisa por prefixo
			function pesquisar_prefixo_hospedes(){
				var prefixo = prompt("Informe o início do nome da(o) hóspede para pesquisa");
				var nomesEncontrados = [];

				for (var i=0; i<lista_hospedes.length;i++){
					if (lista_hospedes[i].nome.startsWith(prefixo)){
						nomesEncontrados.push(lista_hospedes[i].nome);
					}
				}

				if (nomesEncontrados.length>0){
					alert("Hóspedes encontrados:\n"+nomesEncontrados.join("\n"));
				} else {
					alert("Nenhum hóspede encontrado.");
				}

				sistema_cadastrar_hospedes();
			}



			// Listagem de hóspedes por ordem alfabética
			function listar_hospedes(){
				var listaOrdenada = [...lista_hospedes];

				listaOrdenada.sort(function(a, b) {
					return a.nome.localeCompare(b.nome);
				});

				var texto = "Hóspedes cadastrados:\n";

				for (var i = 0; i < listaOrdenada.length; i++) {
					texto += (i + 1) + ". " +
						listaOrdenada[i].nome +
						" - " +
						listaOrdenada[i].data.toLocaleString() +
						"\n";
				}

				alert(texto);

				sistema_cadastrar_hospedes();
			}



			// Atualizar hóspedes
			function atualizar_hospede(){
				if (lista_hospedes.length===0){
					alert("Nenhum hóspede cadastrado.");
					sistema_cadastrar_hospedes();
					return;
				}

				var listaOrdenada = [...lista_hospedes];

				listaOrdenada.sort(function(a, b) {
					return a.nome.localeCompare(b.nome);
				});

				var lista="";

				for(var i=0;i<listaOrdenada.length;i++){
					lista += (i+1)+". "+listaOrdenada[i].nome+"\n";
				}

				var indice = parseInt(prompt("Hóspedes cadastrados:\n\n"+lista+"\n Informe o número do hóspede que deseja atualizar"));

				if (indice<1 || indice > listaOrdenada.length || isNaN(indice)){
					alert("Hóspede não encontrado!");
					sistema_cadastrar_hospedes();
					return;
				}

				var novoNome=prompt("Informe o nome atualizado do hóspede:");

				var nomeExiste = false;

				for (var i = 0; i < lista_hospedes.length; i++) {
					if (lista_hospedes[i].nome === novoNome) {
						nomeExiste = true;
						break;
					}
				}

				if (nomeExiste){
					alert("Hóspede já cadastrado");
					sistema_cadastrar_hospedes();
					return;
				}

				listaOrdenada[indice-1].nome=novoNome;

				alert("Nome do hóspede atualizado com sucesso!");

				sistema_cadastrar_hospedes();
			}



			// Remove hóspede
			function remover_hospede(){
				if (lista_hospedes.length===0){
					alert("Nenhum hóspede cadastrado");
					sistema_cadastrar_hospedes();
					return;
				}

				var listaOrdenada = [...lista_hospedes];

				listaOrdenada.sort(function(a, b) {
					return a.nome.localeCompare(b.nome);
				});

				var lista="";

				for (var i = 0; i < listaOrdenada.length; i++) {
					lista += (i + 1) + ". " + listaOrdenada[i].nome + "\n";
				}

				var indice = parseInt(prompt("Hóspedes cadastrados:\n\n" + lista + "\nInforme o número do hóspede que deseja remover:"));

				if (indice < 1 || indice > listaOrdenada.length || isNaN(indice)) {
					alert("Hóspede não encontrado.");
					sistema_cadastrar_hospedes();
					return;
				}

				var nome_hospede = listaOrdenada[indice - 1].nome;

				// Remove o hóspede da lista pelo índice dele
				var posicaoOriginal = lista_hospedes.indexOf(listaOrdenada[indice - 1]);

				lista_hospedes.splice(posicaoOriginal, 1);

				alert("Hóspede " + nome_hospede + " removido com sucesso!");

				sistema_cadastrar_hospedes();
			}



			function erro_pesquisar_hospedes(){
				alert('Por favor, informe um número entre 1 e 7');
				sistema_cadastrar_hospedes();
			}



			function eventos(){
				alert(`HOTEL ${nomeHotel} - EVENTOS`);
				var convidados = parseInt(prompt("Informe o número de convidados"));

				if (isNaN(convidados) || convidados < 0 || convidados > 350) {
					alert("Número de convidados inválido.");
					inicio();
					return;
				}

				var cadeirasExtras = 0;
				var auditorio;

				if (convidados > 150 && convidados <= 220) {
					cadeirasExtras = convidados - 150;
				}

				if (convidados <= 220) {
					auditorio = "Laranja";
					alert("Auditório Laranja\nCadeiras adicionais: " + cadeirasExtras);
				} else {
					auditorio = "Colorado";
					alert("Auditório Colorado");
				}

				// Agenda
				var dia = prompt("Informe o dia da semana");
				var horaInicio = parseInt(prompt("Informe o horário de início do evento"));

				// Fim de semana: 7h até 15h
				if (dia == "sabado" || dia == "domingo") {
					if (isNaN(horaInicio) || horaInicio < 7 || horaInicio > 15) {
						alert("Horário inválido.");
						inicio();
						return;
					}
				} else {
					// Segunda a sexta: 7h até 23h
					if (isNaN(horaInicio) || horaInicio < 7 || horaInicio > 23) {
						alert("Horário inválido.");
						inicio();
						return;
					}
				}

				// Verificação duração do evento
				var duracao = parseInt(prompt("Informe a duração do evento (1 a 12 horas)"));

				if (isNaN(duracao) || duracao < 1 || duracao > 12) {
					alert("Duração inválida.");
					inicio();
					return;
				}

				// Verificação se o evento ocorre dentro do horário permitido
				var horaFim = horaInicio + duracao;

				if (dia == "sabado" || dia == "domingo") {
					if (horaFim > 15) {
						alert("O evento ultrapassa o horário permitido.");
						inicio();
						return;
					}
				} else {
					if (horaFim > 23) {
						alert("O evento ultrapassa o horário permitido.");
						inicio();
						return;
					}
				}

				// Pedido do nome da empresa
				var empresa = prompt("Informe o nome da empresa");

				// Garçons 
				var garconsBase = Math.ceil(convidados / 12);
				var garconsReforco = Math.floor(duracao / 2);
				var totalGarcons = garconsBase + garconsReforco;

				var custoGarcons = totalGarcons * duracao * 10.50;

				// Buffet
				var cafe = convidados * 0.2;
				var agua = convidados * 0.5;
				var salgados = convidados * 7;

				var custoCafe = cafe * 0.80;
				var custoAgua = agua * 0.40;
				var custoSalgados = (salgados / 100) * 34;

				var custoBuffet = custoCafe + custoAgua + custoSalgados;

				// Valor total do eveto -> garçons e buffet
				var totalEvento = custoGarcons + custoBuffet;

				var agenda = {
					auditorio: auditorio,
					empresa: empresa,
					dia: dia,
					horaInicio: horaInicio,
					horaFim: horaFim,
					totalEvento: totalEvento
				};

				alert(
					"Resumo do Evento\n" +
					"Auditório: " + auditorio +
					"\nEmpresa: " + empresa +
					"\nDia: " + dia +
					"\nHorário: " + horaInicio + "h às " + horaFim + "h" +
					"\nConvidados: " + convidados +
					"\nGarçons: " + totalGarcons +
					"\nDuração: " + duracao + " horas" +
					"\nCusto dos garçons: R$ " + custoGarcons.toFixed(2) +
					"\nCusto do buffet: R$ " + custoBuffet.toFixed(2) +
					"\nCusto total do evento: R$ " + totalEvento.toFixed(2)
				);

				// Confirmação
				var confirmar = prompt("Deseja confirmar a reserva? (S/N)");

				if (confirmar == "S") {
					eventosConfirmados.push(agenda);
					alert("Reserva efetuada com sucesso.");
				} else {
					alert("Reserva não efetuada.");
				}

				inicio();
			}



			function ar_condicionado(){
				alert(`HOTEL ${nomeHotel} - AR-CONDICIONADO`);
				var continuar = "S";
				var menorOrcamento = null;
				var maiorOrcamento = null;
				var nomeMenor = "";
				var nomeMaior = "";

				while (continuar == "S") {
					var nomeEmpresa = prompt("Informe o nome da empresa");
					var valorAparelho = parseFloat(prompt("Informe o valor por aparelho"));
					var quantidadeAparelhos = parseInt(prompt("Informe a quantidade de aparelhos"));
					var percentualDesconto = parseFloat(prompt("Informe o percentual de desconto"));
					var quantidadeMinima = parseInt(prompt("Informe a quantidade mínima para aplicar o desconto"));
					var taxaDeslocamento = parseFloat(prompt("Informe a taxa fixa de deslocamento"));

					var valorBruto = valorAparelho * quantidadeAparelhos;
					var desconto = 0;

					// Verifica se a quantidade de aparelhos recebe desconto
					if (quantidadeAparelhos >= quantidadeMinima) {
						desconto = valorBruto * (percentualDesconto / 100);
					}

					var valorFinal = valorBruto - desconto + taxaDeslocamento;

					alert(
						"Orçamento\n\n" +
						"Empresa: " + nomeEmpresa +
						"\nValor bruto: R$ " + valorBruto.toFixed(2) +
						"\nDesconto: R$ " + desconto.toFixed(2) +
						"\nTaxa de deslocamento: R$ " + taxaDeslocamento.toFixed(2) +
						"\nValor final: R$ " + valorFinal.toFixed(2)
					);

					// Menor orçamento
					if (menorOrcamento === null || valorFinal < menorOrcamento) {
						menorOrcamento = valorFinal;
						nomeMenor = nomeEmpresa;
					}

					// Maior orçamento
					if (maiorOrcamento === null || valorFinal > maiorOrcamento) {
						maiorOrcamento = valorFinal;
						nomeMaior = nomeEmpresa;
					}

					continuar = prompt("Deseja cadastrar outra empresa? (S/N)");
				}

				// Compara orçamentos
				var diferencaPercentual = ((maiorOrcamento - menorOrcamento) / menorOrcamento) * 100;

				alert(
					"Comparação dos orçamentos\n\n" +
					"Menor orçamento: " + nomeMenor + " - R$ " + menorOrcamento.toFixed(2) +
					"\nMaior orçamento: " + nomeMaior + " - R$ " + maiorOrcamento.toFixed(2) +
					"\nDiferença percentual: " + diferencaPercentual.toFixed(2) + "%"
				);

				inicio();
			}



			function abastecer_carros() {
				alert(`HOTEL ${nomeHotel} - ABASTECER`);
				var tanque = 42;

				// Alcool e gasolina Wayne
				var precoAlcoolWayne = parseFloat(prompt("Informe o preço do álcool na Wayne Oil:"));
				var precoGasolinaWayne = parseFloat(prompt("Informe o preço da gasolina na Wayne Oil:"));

				// Alcool e gasolina Stark
				var precoAlcoolStark = parseFloat(prompt("Informe o preço do álcool na Stark Petrol:"));
				var precoGasolinaStark = parseFloat(prompt("Informe o preço da gasolina na Stark Petrol:"));

				var combustivelWayne;
				var precoWayne;

				// Se alcool for mais barato que gasolina (Wayne)
				if (precoAlcoolWayne <= precoGasolinaWayne * 0.70) {
					combustivelWayne = "Álcool";
					precoWayne = precoAlcoolWayne;
				// Se gasolina for mais barato que alcool (Wayne)
				} else {
					combustivelWayne = "Gasolina";
					precoWayne = precoGasolinaWayne;
				}

				var combustivelStark;
				var precoStark;

				// Se alcool for mais barato que gasolina (Stark)
				if (precoAlcoolStark <= precoGasolinaStark * 0.70) {
					combustivelStark = "Álcool";
					precoStark = precoAlcoolStark;
					
				// Se gasolina for mais barato que alcool (Stark)
				} else {
					combustivelStark = "Gasolina";
					precoStark = precoGasolinaStark;
				}

				var custoWayne = precoWayne * tanque;
				var custoStark = precoStark * tanque;

				alert(
					"Wayne Oil\n" +
					"Combustível mais vantajoso: " + combustivelWayne +
					"\nCusto para abastecer 42L: R$ " + custoWayne.toFixed(2) +
					"\n\nStark Petrol\n" +
					"Combustível mais vantajoso: " + combustivelStark +
					"\nCusto para abastecer 42L: R$ " + custoStark.toFixed(2)
				);

				if (custoWayne <= custoStark) {
					alert(
						"Ranking:\n" +
						"1º Wayne Oil - R$ " + custoWayne.toFixed(2) +
						"\n2º Stark Petrol - R$ " + custoStark.toFixed(2)
					);
				} else {
					alert(
						"Ranking:\n" +
						"1º Stark Petrol - R$ " + custoStark.toFixed(2) +
						"\n2º Wayne Oil - R$ " + custoWayne.toFixed(2)
					);
				}

				inicio();
			}
			


			function relatorios_operacionais(){
				var totalReservas = reservas.length;

				var taxaOcupacao = (quartosOcupados.length / 20) * 100;

				var totalHospedes = lista_hospedes.length;

				var totalEventos = eventosConfirmados.length;

				var receitaHospedagem = 0;

				// Total de receita de hospedam
				for (var i = 0; i < reservas.length; i++) {
					receitaHospedagem += reservas[i].total;
				}

				var receitaEventos = 0;

				// Total de receita de eventos
				for (var i = 0; i < eventosConfirmados.length; i++) {
					receitaEventos += eventosConfirmados[i].totalEvento;
				}

				var receitaTotal = receitaHospedagem + receitaEventos;

				alert(
					"RELATÓRIO OPERACIONAL\n\n" +
					"Reservas de quartos confirmadas: " + totalReservas +
					"\nTaxa de ocupação: " + taxaOcupacao.toFixed(2) + "%" +
					"\nHóspedes cadastrados: " + totalHospedes +
					"\nEventos confirmados: " + totalEventos +
					"\n\nReceita de hospedagem: R$ " + receitaHospedagem.toFixed(2) +
					"\nReceita de eventos: R$ " + receitaEventos.toFixed(2) +
					"\nReceita total: R$ " + receitaTotal.toFixed(2)
				);

				inicio();
			}
