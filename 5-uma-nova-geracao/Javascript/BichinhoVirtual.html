<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bichinho Virtual</title>
</head>

    <body>

        <script>
            class BichinhoVirtual {

                constructor(nome) {
                    this.nome = nome;
                    this.nivelDeFome = 50;
                    this.nivelFelicidade = 50;
                    this.nivelCansaco = 0;
                    this.idade = 0;
                }

                alimentar() {
                    this.nivelDeFome -= 10;

                    if (this.nivelDeFome < 0) {
                        this.nivelDeFome = 0;
                    }

                    alert(`${this.nome} foi alimentado. A fome diminuiu.`);
                }

                brincar() {
                    this.nivelFelicidade += 10;
                    this.nivelCansaco += 10;

                    if (this.nivelFelicidade > 100) {
                        this.nivelFelicidade = 100;
                    }

                    if (this.nivelCansaco > 100) {
                        this.nivelCansaco = 100;
                    }

                    alert(`${this.nome} brincou. A felicidade aumentou e o cansaço também.`);
                }

                descansar() {
                    this.nivelCansaco -= 20;

                    if (this.nivelCansaco < 0) {
                        this.nivelCansaco = 0;
                    }

                    alert(`${this.nome} descansou. O cansaço diminuiu.`);
                }

                verificarStatus() {
                    alert(
                        `Status de ${this.nome}:\n` +
                        `Idade: ${this.idade}\n` +
                        `Fome: ${this.nivelDeFome}\n` +
                        `Felicidade: ${this.nivelFelicidade}\n` +
                        `Cansaço: ${this.nivelCansaco}`
                    );
                }

                passarTempo() {
                    this.nivelDeFome += 3;
                    this.nivelFelicidade -= 3;
                    this.nivelCansaco += 10;
                    this.idade += 1;
                }

                verificarFimDeJogo() {

                    if (this.idade >= 50) {
                        alert(`${this.nome} chegou aos 50 anos! Você venceu!`);
                        return true;
                    }

                    if (this.nivelDeFome >= 100) {
                        alert(`${this.nome} ficou com muita fome. Você perdeu!`);
                        return true;
                    }

                    if (this.nivelCansaco >= 100) {
                        alert(`${this.nome} ficou muito cansado. Você perdeu!`);
                        return true;
                    }

                    if (this.nivelFelicidade <= 0) {
                        alert(`${this.nome} ficou depressivo. Você perdeu!`);
                        return true;
                    }

                    return false;
                }
            }

            const nomePet = prompt("Digite o nome do seu bichinho:");

            const pet = new BichinhoVirtual(nomePet);


            while (true) {

                const escolha = prompt(
                    `Escolha uma ação para ${pet.nome}:

            1. Alimentar
            2. Brincar
            3. Descansar
            4. Verificar status
            5. Sair`
                );

                switch (parseInt(escolha)) {

                    case 1:
                        pet.alimentar();
                        break;

                    case 2:
                        pet.brincar();
                        break;

                    case 3:
                        pet.descansar();
                        break;

                    case 4:
                        pet.verificarStatus();
                        break;

                    case 5:
                        alert("FIM!");
                        break;

                    default:
                        alert("Opção inválida. Tente novamente.");
                        continue;
                }

                if (parseInt(escolha) === 5) {
                    break;
                }

                pet.passarTempo();

                alert(
                    `Agora seu bichinho está...

            Idade: ${pet.idade}
            Fome: ${pet.nivelDeFome}
            Felicidade: ${pet.nivelFelicidade}
            Cansaço: ${pet.nivelCansaco}`
                );

                if (pet.verificarFimDeJogo()) {
                    break;
                }
            }

            </script>

    </body>

</html>
